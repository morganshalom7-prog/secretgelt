<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Gelt</title>
<meta name="description" content="A Hanukkah gift exchange. No reindeer, no accounts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#eef3fb; --surface:#ffffff; --ink:#142048; --muted:#55608a; --line:#d3def2;
  --accent:#1d3f9e; --accent-ink:#ffffff; --gold:#f4b73a; --gold-ink:#1a1f45; --coral:#c9402d; --soft:#e4ecfb;
  --hero-a:#0b1a4a; --hero-b:#173a96; --hero-ink:#ffffff; --hero-sub:#c9d8ff;
  --font-d:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0a1230; --surface:#13204a; --ink:#eaf0ff; --muted:#a6b3de; --line:#2a3c74;
    --accent:#9bb8ff; --accent-ink:#0a1230; --soft:#1b2c5e; --hero-a:#07102e; --hero-b:#14308a; --coral:#ff8f7e;
  }
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(16px,env(safe-area-inset-top,0px));
  padding-bottom:max(56px,env(safe-area-inset-bottom,0px));
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.75rem} h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.hero{background:linear-gradient(170deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.hero-text{padding:28px 22px 0;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(2.4rem,9vw,3.6rem);font-weight:700;letter-spacing:-.01em}
.hero h1 span{color:var(--gold)}
.tag{font-family:var(--font-d);font-weight:500;font-size:1.2rem}
.rot{color:var(--hero-sub)}
.hero svg{display:block;width:100%;height:auto;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.step{background:var(--soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.step b{font-family:var(--font-d);font-weight:600;font-size:1.05rem}
.step span{color:var(--muted);font-size:.95rem}
label,.lbl{font-weight:700;font-size:.9rem;display:block;margin-bottom:6px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid3{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.pcard{background:var(--soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pcard .two{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;align-items:center}
.pre{position:relative}
.pre i{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-weight:700}
.pre input{padding-left:28px}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;text-align:center;text-decoration:none;font-family:var(--font-d);font-weight:600;font-size:1.05rem;border:0;border-radius:999px;padding:13px 22px;background:var(--gold);color:var(--gold-ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.small{font-size:.95rem;padding:9px 16px}
.rm{height:44px;width:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-size:1.2rem;line-height:1}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0;text-align:left;text-decoration:underline}
.err{color:var(--coral);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.9rem}
.person{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.person:first-of-type{border-top:0;padding-top:0}
.person .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.notice{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.reveal{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px 0}
.giftbtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);font-family:var(--font-d);font-weight:600;font-size:1.1rem}
.giftbtn svg{width:140px;height:auto;transition:transform .2s}
.giftbtn:hover svg{transform:rotate(-4deg) scale(1.04)}
.name-big{font-family:var(--font-d);font-weight:700;font-size:clamp(2.2rem,9vw,3.2rem);color:var(--accent);animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.wish{background:var(--soft);border-radius:14px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.flame:nth-of-type(2n){animation-duration:1.3s;animation-delay:-.4s}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.92,1.14)}}
@media (prefers-reduced-motion:reduce){.flame,.name-big{animation:none}.giftbtn svg{transition:none}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20}
#toast[hidden]{display:none}
[hidden]{display:none!important}
.foot{text-align:center;color:var(--muted);font-family:var(--font-d);padding-top:8px}
@media (max-width:540px){
  .grid3{grid-template-columns:1fr}
  .pcard .two{grid-template-columns:1fr 44px}
  .pcard .two .pc{grid-column:1;grid-row:2}
  .pcard .two .rm{grid-column:2;grid-row:1}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-text">
      <h1>Secret <span>Gelt</span></h1>
      <p class="tag">Finally, a gift exchange with no reindeer.</p>
      <p class="rot" id="rot"></p>
    </div>
    <div id="scene"></div>
  </header>
  <main id="view"></main>
  <p class="foot">Chag Hanukkah sameach!</p>
</div>
<div id="toast" hidden></div>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var toastT;
  var LINES = [
    'Eight nights. One secret. Zero tinsel.',
    'Spin the dreidel, not the group chat.',
    'Oy to the world.',
    'May your gelt be chocolate and your gifts be good.',
    'Light the candles, then guess who got you.'
  ];

  /* Links carry the data, so no server or login is needed. */
  function enc(o){
    return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function dec(s){
    s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
    return JSON.parse(decodeURIComponent(escape(atob(s))));
  }
  function base(){ return location.href.split('#')[0]; }

  /* ---------- Illustration ---------- */
  function person(x, s, skin, shirt, hair, o){
    o = o || {}; var pants = o.pants || '#27386e', h = '';
    h += '<g transform="translate(' + x + ' 236) scale(' + s + ')">';
    h += '<rect x="-12" y="-46" width="10" height="46" rx="5" fill="' + pants + '"/><rect x="2" y="-46" width="10" height="46" rx="5" fill="' + pants + '"/>';
    if (o.dress) h += '<path d="M-19 -98 h38 l10 56 h-58z" fill="' + shirt + '"/>';
    else h += '<rect x="-18" y="-100" width="36" height="60" rx="16" fill="' + shirt + '"/>';
    h += '<rect x="-29" y="-94" width="12" height="40" rx="6" fill="' + shirt + '" transform="rotate(12 -23 -94)"/>';
    h += '<rect x="17" y="-94" width="12" height="40" rx="6" fill="' + shirt + '" transform="rotate(-12 23 -94)"/>';
    h += '<circle cx="0" cy="-117" r="16" fill="' + skin + '"/>';
    if (o.bun) h += '<circle cx="0" cy="-139" r="7" fill="' + hair + '"/>';
    h += '<path d="M-17 -119 a17 17 0 0 1 34 0 q-17 -9 -34 0z" fill="' + hair + '"/>';
    if (o.kippah) h += '<ellipse cx="0" cy="-131" rx="10" ry="4.5" fill="' + o.kippah + '"/>';
    if (o.glasses) h += '<g fill="none" stroke="#1b2140" stroke-width="1.6"><circle cx="-6" cy="-116" r="4.6"/><circle cx="6" cy="-116" r="4.6"/><path d="M-1.4 -116 h2.8"/></g>';
    h += '<circle cx="-6" cy="-116" r="1.7" fill="#1b2140"/><circle cx="6" cy="-116" r="1.7" fill="#1b2140"/>';
    h += '<path d="M-5 -109 q5 5 10 0" fill="none" stroke="#1b2140" stroke-width="1.8" stroke-linecap="round"/>';
    h += '<circle cx="-10" cy="-110" r="2.6" fill="#ff8f86" opacity=".55"/><circle cx="10" cy="-110" r="2.6" fill="#ff8f86" opacity=".55"/></g>';
    return h;
  }
  function gift(x, y, w, c1, c2){
    var hh = w * .8;
    return '<g transform="translate(' + x + ' ' + y + ')"><rect x="' + (-w/2) + '" y="' + (-hh) + '" width="' + w + '" height="' + hh + '" rx="3" fill="' + c1 + '"/>' +
      '<rect x="-3" y="' + (-hh) + '" width="6" height="' + hh + '" fill="' + c2 + '"/>' +
      '<circle cx="-5" cy="' + (-hh - 3) + '" r="5" fill="none" stroke="' + c2 + '" stroke-width="3"/><circle cx="5" cy="' + (-hh - 3) + '" r="5" fill="none" stroke="' + c2 + '" stroke-width="3"/></g>';
  }
  function menorah(x){
    var h = '<g transform="translate(' + x + ' 236) scale(1.45)">';
    h += '<path d="M-64 -52 q0 30 64 30 q64 0 64 -30" fill="none" stroke="#f4b73a" stroke-width="5" stroke-linecap="round"/>';
    h += '<rect x="-4" y="-24" width="8" height="18" fill="#f4b73a"/><path d="M-24 0 q0 -9 24 -9 q24 0 24 9z" fill="#f4b73a"/>';
    for (var i = 0; i < 9; i++){
      var cx = -64 + i * 16, top = (i === 4) ? -92 : -76;
      h += '<rect x="' + (cx - 3.5) + '" y="' + top + '" width="7" height="' + (-52 - top) + '" rx="2" fill="#e9f1ff"/>';
      h += '<ellipse class="flame" cx="' + cx + '" cy="' + (top - 7) + '" rx="4" ry="7.5" fill="#ffc83d"/>';
      h += '<ellipse class="flame" cx="' + cx + '" cy="' + (top - 5) + '" rx="2" ry="4" fill="#fff3b8"/>';
    }
    return h + '</g>';
  }
  function scene(){
    var pts = [[40,30,2],[120,70,1.5],[210,24,2],[300,60,1.4],[430,28,2],[520,66,1.6],[610,30,2.2],[690,76,1.5],[70,120,1.4],[660,130,1.6],[560,110,1.2],[160,110,1.2]];
    var s = '<svg viewBox="0 0 720 260" role="img" aria-label="A family and friends gathered around a lit menorah with presents">';
    s += pts.map(function(p){ return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + p[2] + '" fill="#fff" opacity=".7"/>'; }).join('');
    s += '<g transform="translate(360 52)"><polygon points="0,-16 14,8 -14,8" fill="#f4b73a" opacity=".9"/><polygon points="0,16 14,-8 -14,-8" fill="#f4b73a" opacity=".9"/></g>';
    s += '<rect x="0" y="236" width="720" height="24" fill="#0a1640"/>';
    s += person(78, 1, '#e8b48d', '#e8604c', '#c9ccd6', {bun:true, dress:true, glasses:true});
    s += person(170, 1.08, '#8d5a3b', '#2f8f83', '#2a1c14', {kippah:'#f4b73a'});
    s += person(268, .6, '#f1c9a5', '#f4b73a', '#6b3a1e', {pants:'#1b2c63'});
    s += gift(300, 236, 34, '#e8604c', '#ffe08a');
    s += menorah(360);
    s += gift(432, 236, 30, '#5aa9e6', '#ffffff');
    s += person(486, 1, '#f1c9a5', '#7a5bd6', '#7a3d1f', {dress:true});
    s += person(590, 1.03, '#c68a63', '#5aa9e6', '#1f1a2e', {kippah:'#ffffff', glasses:true});
    s += person(672, .62, '#8d5a3b', '#e8604c', '#1f1a2e', {pants:'#1b2c63'});
    s += gift(640, 236, 26, '#f4b73a', '#e8604c');
    return s + '</svg>';
  }
  function giftBox(){
    return '<svg viewBox="0 0 140 130" aria-hidden="true"><rect x="16" y="52" width="108" height="72" rx="8" fill="#e8604c"/><rect x="62" y="52" width="16" height="72" fill="#ffe08a"/><rect x="10" y="38" width="120" height="24" rx="7" fill="#f26b57"/><rect x="62" y="38" width="16" height="24" fill="#ffe08a"/><path d="M70 38 C40 4 22 30 56 38z M70 38 C100 4 118 30 84 38z" fill="none" stroke="#ffe08a" stroke-width="9" stroke-linejoin="round"/></svg>';
  }

  /* ---------- Helpers ---------- */
  function toast(msg){ var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 2200); }
  function money(b){ if (!b) return ''; var n = String(b).trim(); return /^[0-9]+([.][0-9]+)?$/.test(n) ? '$' + n : n; }
  function dateStr(d){
    if (!d) return '';
    try { return new Date(d + 'T12:00:00').toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'}); } catch (e) { return d; }
  }
  function isEmail(c){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.trim()); }
  function validContact(c){ return isEmail(c) || c.replace(/\D/g, '').length >= 7; }
  function chips(x, d, b){
    var c = []; if (d) c.push(dateStr(d)); if (b) c.push('Budget ' + money(b));
    return c.length ? '<div class="chips">' + c.map(function(v){ return '<span class="chip">' + esc(v) + '</span>'; }).join('') + '</div>' : '';
  }
  function copyText(text, input){
    var fail = function(){ if (input){ input.focus(); input.select(); } toast('Select the link and copy it'); };
    try { navigator.clipboard.writeText(text).then(function(){ toast('Copied'); }, fail); } catch (e) { fail(); }
  }

  /* ---------- Create ---------- */
  function rowHtml(i){
    var ph = [['Savta Ruth','ruth@example.com'],['Uncle Moishe','(555) 123-4567'],['Cousin Dani','dani@example.com'],['Zayde Sol','(555) 987-6543']][i % 4];
    return '<div class="pcard"><div class="two"><input class="pn" type="text" placeholder="' + ph[0] + '" aria-label="Name" autocomplete="off">' +
      '<input class="pc" type="text" inputmode="email" placeholder="' + ph[1] + '" aria-label="Email or phone" autocomplete="off">' +
      '<button type="button" class="rm" data-act="rm" aria-label="Remove person">&times;</button></div>' +
      '<textarea class="pw" rows="2" placeholder="Wish list (optional). Paste what they told you." aria-label="Wish list"></textarea></div>';
  }
  function viewHome(){
    var h = '<section class="card"><h2>How it works</h2><div class="steps">' +
      '<div class="step"><b>1. Set it up</b><span>Name it, pick a date and a budget, add everyone.</span></div>' +
      '<div class="step"><b>2. Draw the names</b><span>One tap. Nobody gets themselves.</span></div>' +
      '<div class="step"><b>3. Text or email the links</b><span>Each person opens a gift to see who they got. No accounts.</span></div></div></section>';
    h += '<section class="card"><h2>Start an exchange</h2>' +
      '<div><label for="exName">Exchange name</label><input id="exName" type="text" placeholder="The Goldberg Family Eight Nights" autocomplete="off"></div>' +
      '<div class="grid3"><div><label for="exDate">Date</label><input id="exDate" type="date"></div>' +
      '<div><label for="exBudget">Budget per gift</label><div class="pre"><i>$</i><input id="exBudget" type="text" inputmode="decimal" placeholder="25" autocomplete="off"></div></div></div>' +
      '<div><span class="lbl">Who is playing? Add an email or a phone number for each person.</span>' +
      '<div id="rows" style="display:flex;flex-direction:column;gap:10px">' + rowHtml(0) + rowHtml(1) + rowHtml(2) + '</div>' +
      '<button type="button" class="link" data-act="addrow">+ Add another person</button></div>' +
      '<p id="formErr" class="err" hidden></p>' +
      '<button type="button" class="btn" data-act="create">Draw the names</button></section>';
    $('#view').innerHTML = h;
  }
  function create(){
    var err = $('#formErr'); err.hidden = true;
    var fail = function(m){ err.textContent = m; err.hidden = false; };
    var x = $('#exName').value.trim();
    if (!x) return fail('Give your exchange a name.');
    var ps = [], bad = null;
    document.querySelectorAll('#rows .pcard').forEach(function(r){
      var n = r.querySelector('.pn').value.trim(), c = r.querySelector('.pc').value.trim(), w = r.querySelector('.pw').value.trim();
      if (!n && !c) return;
      if (!n || !validContact(c)) { bad = bad || (n || 'One person'); return; }
      ps.push({n:n, c:c, w:w});
    });
    if (bad) return fail(bad + ' needs a name plus a valid email or phone number.');
    if (ps.length < 2) return fail('Add at least two people.');
    var d = $('#exDate').value, b = $('#exBudget').value.trim();
    var sh = ps.slice();
    for (var i = sh.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = sh[i]; sh[i] = sh[j]; sh[j] = t; }
    var out = sh.map(function(g, k){
      var r = sh[(k + 1) % sh.length];
      return {n:g.n, c:g.c, g:enc({x:x, d:d, b:b, f:g.n, t:r.n, w:r.w})};
    });
    location.hash = 'o=' + enc({x:x, d:d, b:b, p:out});
  }

  /* ---------- Organizer ---------- */
  function viewOrganizer(o){
    var h = '<section class="card"><h2>' + esc(o.x) + '</h2>' + chips(o.x, o.d, o.b) +
      '<p class="notice">Names are drawn. Send each person their private link now. You will not see who got whom, so you can play too.</p>' +
      '<p class="muted">Bookmark this page or keep it open until everyone has their link. Keep it private.</p></section>';
    h += '<section class="card"><h3>Send the links</h3>';
    o.p.forEach(function(p, i){
      var link = base() + '#g=' + p.g;
      var msg = 'Shalom ' + p.n + '! You are in ' + o.x + ' (Secret Gelt).' + (o.d ? ' Date: ' + dateStr(o.d) + '.' : '') + (o.b ? ' Budget: ' + money(o.b) + '.' : '') + ' Open your gift to see who you got: ' + link;
      var action;
      if (isEmail(p.c)) action = '<a class="btn small" href="mailto:' + esc(p.c.trim()) + '?subject=' + encodeURIComponent(o.x + ': your Secret Gelt') + '&body=' + encodeURIComponent(msg) + '">Email</a>';
      else {
        var num = p.c.replace(/[^\d+]/g, '');
        var sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? '&' : '?';
        action = '<a class="btn small" href="sms:' + esc(num) + sep + 'body=' + encodeURIComponent(msg) + '">Text</a>';
      }
      h += '<div class="person"><div class="top"><b>' + esc(p.n) + '</b><span class="muted">' + esc(p.c) + '</span></div>' +
        '<div class="acts">' + action + '<button type="button" class="btn small ghost" data-act="copy" data-i="' + i + '">Copy message</button></div>' +
        '<input id="lk' + i + '" readonly value="' + esc(link) + '" aria-label="Private link for ' + esc(p.n) + '"></div>';
    });
    h += '</section><p style="text-align:center"><a class="link" href="' + esc(base()) + '">Start a new exchange</a></p>';
    $('#view').innerHTML = h;
    O = o;
  }
  var O = null;

  /* ---------- Participant ---------- */
  var G = null, revealed = false;
  function viewGift(g){
    G = g; revealed = false; renderGift();
  }
  function renderGift(){
    var g = G, h = '<section class="card"><h2>Shalom, ' + esc(g.f) + '!</h2><p class="muted">' + esc(g.x) + '</p>' + chips(g.x, g.d, g.b);
    if (!revealed){
      h += '<div class="reveal"><button type="button" class="giftbtn" data-act="reveal">' + giftBox() + '<span>Tap to open your gift</span></button></div>';
    } else {
      h += '<div class="reveal"><p class="muted">You are the Secret Gelter for</p><div class="name-big">' + esc(g.t) + '</div><p class="muted">Keep it secret until the gifts are opened.</p></div>' +
        '<h3>' + esc(g.t) + '\'s wish list</h3>' + (g.w ? '<div class="wish">' + esc(g.w) + '</div>' : '<p class="muted">No wish list yet. Time to ask for hints.</p>');
    }
    h += '</section><p style="text-align:center"><a class="link" href="' + esc(base()) + '">Start your own exchange</a></p>';
    $('#view').innerHTML = h;
  }

  /* ---------- Router and events ---------- */
  function route(){
    var h = location.hash.slice(1);
    try {
      if (h.indexOf('g=') === 0) return viewGift(dec(h.slice(2)));
      if (h.indexOf('o=') === 0) return viewOrganizer(dec(h.slice(2)));
    } catch (e) {
      $('#view').innerHTML = '<section class="card"><h2>That link looks incomplete</h2><p class="muted">Ask for it to be sent again, or <a class="link" href="' + esc(base()) + '">start a new exchange</a>.</p></section>';
      return;
    }
    viewHome();
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'addrow'){ var d = document.createElement('div'); d.innerHTML = rowHtml($('#rows').children.length); $('#rows').appendChild(d.firstChild); }
    else if (a === 'rm'){ if ($('#rows').children.length > 2) b.closest('.pcard').remove(); else toast('Keep at least two people'); }
    else if (a === 'create') create();
    else if (a === 'reveal'){ revealed = true; renderGift(); }
    else if (a === 'copy'){
      var i = +b.getAttribute('data-i'), p = O.p[i], link = base() + '#g=' + p.g;
      copyText('Shalom ' + p.n + '! You are in ' + O.x + ' (Secret Gelt). Open your gift to see who you got: ' + link, $('#lk' + i));
    }
  });
  window.addEventListener('hashchange', function(){ window.scrollTo(0, 0); route(); });
  $('#scene').innerHTML = scene();
  $('#rot').textContent = LINES[Math.floor(Math.random() * LINES.length)];
  route();
})();
</script>
</body>
</html>
