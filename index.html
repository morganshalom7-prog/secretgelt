<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Gelt</title>
<meta name="description" content="A Hanukkah gift exchange. Everyone adds a wish list, then draws names. No reindeer, no accounts.">
<meta property="og:title" content="Secret Gelt">
<meta property="og:description" content="A Hanukkah gift exchange with wish lists. No reindeer, no accounts.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#eef3fb; --surface:#ffffff; --ink:#142048; --muted:#55608a; --line:#d3def2;
  --accent:#1d3f9e; --gold:#f4b73a; --gold-ink:#1a1f45; --coral:#c9402d; --soft:#e4ecfb; --good:#1c7a4f;
  --hero-a:#0b1a4a; --hero-b:#173a96; --hero-ink:#ffffff; --hero-sub:#c9d8ff;
  --font-d:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0a1230; --surface:#13204a; --ink:#eaf0ff; --muted:#a6b3de; --line:#2a3c74;
    --accent:#9bb8ff; --soft:#1b2c5e; --hero-a:#07102e; --hero-b:#14308a; --coral:#ff8f7e; --good:#6fd6a3;
  }
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(16px,env(safe-area-inset-top,0px));
  padding-bottom:max(56px,env(safe-area-inset-bottom,0px));
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#view{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.75rem} h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.hero{background:linear-gradient(170deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.hero-text{padding:28px 22px 0;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(2.4rem,9vw,3.6rem);font-weight:700;letter-spacing:-.01em}
.hero h1 span{color:var(--gold)}
.hero a{color:inherit;text-decoration:none}
.tag{font-family:var(--font-d);font-weight:500;font-size:1.2rem}
.rot{color:var(--hero-sub)}
.hero svg{display:block;width:100%;height:auto;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.step{background:var(--soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.step b{font-family:var(--font-d);font-weight:600;font-size:1.05rem}
.step span{color:var(--muted);font-size:.95rem}
label,.lbl{font-weight:700;font-size:.9rem;display:block;margin-bottom:6px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
textarea{resize:vertical;min-height:110px}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid3{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.pre{position:relative}
.pre i{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-weight:700}
.pre input{padding-left:28px}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;text-align:center;text-decoration:none;font-family:var(--font-d);font-weight:600;font-size:1.05rem;border:0;border-radius:999px;padding:13px 22px;background:var(--gold);color:var(--gold-ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.small{font-size:.95rem;padding:9px 16px}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0;text-align:left;text-decoration:underline}
.err{color:var(--coral);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.9rem}
.chip.good{color:var(--good)}
.rowline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.rowline:first-of-type{border-top:0;padding-top:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.copyrow{display:flex;gap:8px}
.pmgr{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.pmgr:first-of-type{border-top:0;padding-top:0}
.pmgr .rowline{border-top:0;padding-top:0}
.editbox{background:var(--soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.copyrow input{font-size:.9rem}
.notice{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.reveal{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px 0}
.giftbtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);font-family:var(--font-d);font-weight:600;font-size:1.1rem}
.giftbtn svg{width:140px;height:auto;transition:transform .2s}
.giftbtn:hover svg{transform:rotate(-4deg) scale(1.04)}
.name-big{font-family:var(--font-d);font-weight:700;font-size:clamp(2.2rem,9vw,3.2rem);color:var(--accent);animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.wish{background:var(--soft);border-radius:14px;padding:12px 14px;overflow-wrap:anywhere}
.wall{display:flex;flex-direction:column;gap:12px}
.wcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wcard b{font-family:var(--font-d);font-weight:600}
.wcard .you{color:var(--accent);font-size:.85rem;font-weight:700;margin-left:6px}
.wcard .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.flame:nth-of-type(2n){animation-duration:1.3s;animation-delay:-.4s}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.92,1.14)}}
@media (prefers-reduced-motion:reduce){.flame,.name-big{animation:none}.giftbtn svg{transition:none}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;max-width:90vw;text-align:center}
[hidden]{display:none!important}
.foot{text-align:center;color:var(--muted);font-family:var(--font-d);padding-top:8px}
.irow{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;align-items:center}
.irows{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.rm{height:44px;width:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-size:1.2rem;line-height:1}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;min-width:0}
a.item:hover{border-color:var(--accent)}
.item .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.item .host{color:var(--muted);font-size:.85rem;white-space:nowrap}
.favwrap{position:relative;width:20px;height:20px;flex:none;color:var(--muted)}
.favwrap svg,.favwrap img{position:absolute;inset:0;width:20px;height:20px;border-radius:4px}
.favwrap img{background:var(--surface)}
.wish .txt,.wcard .txt,.notice .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.wish .items + .txt,.wcard .items + .txt{margin-top:8px}
@media (max-width:540px){
  .grid3{grid-template-columns:1fr}
  .irow{grid-template-columns:1fr 44px}
  .irow .iu{grid-column:1;grid-row:2}
  .irow .rm{grid-column:2;grid-row:1}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-text">
      <h1><a href="#new">Secret <span>Gelt</span></a></h1>
      <p class="tag">Finally, a gift exchange with no reindeer.</p>
      <p class="rot" id="rot"></p>
    </div>
    <div id="scene"></div>
  </header>
  <p id="status" class="notice" hidden></p>
  <main id="view"></main>
  <p class="foot">Chag Hanukkah sameach!</p>
</div>
<div id="toast" hidden></div>

<script>
(function(){
  'use strict';
  var CFG = {
    apiKey: "AIzaSyBL2pmjMid7IsT4r87rVIWYFHi_FrRpME0",
    authDomain: "secret-gelt.firebaseapp.com",
    projectId: "secret-gelt",
    storageBucket: "secret-gelt.firebasestorage.app",
    messagingSenderId: "799263720270",
    appId: "1:799263720270:web:099c5bb32a4d0e383d141f"
  };
  var SDK = 'https://www.gstatic.com/firebasejs/13.4.0/';

  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var db = null, F = null, ready = false, unsub = [], toastT;
  var LINES = [
    'Eight nights. One secret. Zero tinsel.',
    'Spin the dreidel, not the group chat.',
    'Oy to the world.',
    'May your gelt be chocolate and your gifts be good.',
    'Light the candles, then guess who got you.'
  ];

  function rid(n){
    var a = new Uint8Array(n), s = '', al = 'abcdefghijklmnopqrstuvwxyz0123456789';
    (window.crypto || window.msCrypto).getRandomValues(a);
    for (var i = 0; i < n; i++) s += al[a[i] % 36];
    return s;
  }
  function base(){ return location.href.split('#')[0]; }
  function lsGet(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function toast(msg){ var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 2600); }
  function setStatus(msg){ var s = $('#status'); s.textContent = msg || ''; s.hidden = !msg; }
  function money(b){ if (!b) return ''; var n = String(b).trim(); return /^[0-9]+([.][0-9]+)?$/.test(n) ? '$' + n : n; }
  function dateStr(d){
    if (!d) return '';
    try { return new Date(d + 'T12:00:00').toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'}); } catch (e) { return d; }
  }
  function chipsHtml(ex, extra){
    var c = [];
    if (ex.date) c.push('<span class="chip">' + esc(dateStr(ex.date)) + '</span>');
    if (ex.budget) c.push('<span class="chip">Budget ' + esc(money(ex.budget)) + '</span>');
    (extra || []).forEach(function(x){ c.push('<span class="chip' + (x.good ? ' good' : '') + '">' + esc(x.t) + '</span>'); });
    return c.length ? '<div class="chips">' + c.join('') + '</div>' : '';
  }
  function detailsHtml(ex){
    return ex.details ? '<div class="notice"><b>Details and rules</b><div class="txt" style="margin-top:4px">' + esc(ex.details) + '</div></div>' : '';
  }
  function copyText(text, input){
    var fail = function(){ if (input){ input.focus(); input.select(); } toast('Select the link and copy it'); };
    try { navigator.clipboard.writeText(text).then(function(){ toast('Copied'); }, fail); } catch (e) { fail(); }
  }
  function shuffle(a){
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function pushRecent(key, item){
    var l = lsGet(key, []).filter(function(x){ return x.id !== item.id; });
    l.unshift(item); lsSet(key, l.slice(0, 10));
  }
  function watch(ref, cb){
    var got = false;
    var t = setTimeout(function(){ if (!got) setStatus('Still trying to reach the exchange. Check your connection and keep this page open.'); }, 10000);
    var u = F.onSnapshot(ref, function(s){ got = true; clearTimeout(t); setStatus(''); cb(s); },
      function(e){ clearTimeout(t); setStatus('Could not load this exchange (' + (e && e.code || 'error') + ').'); });
    unsub.push(function(){ clearTimeout(t); u(); });
  }
  function needDb(){
    if (db) return false;
    $('#view').innerHTML = '<section class="card"><h2>' + (ready ? 'Cannot reach the database' : 'Loading...') + '</h2>' +
      (ready ? '<p class="muted">Check your connection and reload the page.</p>' : '') + '</section>';
    return true;
  }
  function msgLinks(text, subject){
    var sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? '&' : '?';
    return {
      sms: 'sms:' + sep + 'body=' + encodeURIComponent(text),
      mail: 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(text)
    };
  }

  /* ---------- Wish list items and links ---------- */
  function safeUrl(u){
    u = (u || '').trim(); if (!u) return '';
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    try { var x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') && x.hostname.indexOf('.') > 0 ? x.href : ''; } catch (e) { return ''; }
  }
  function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
  var LINK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>';
  var GIFT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-3-5 0M12 8c2-4 6-3 5 0"/></svg>';
  function favHtml(host){
    return '<span class="favwrap">' + LINK_SVG + '<img alt="" width="20" height="20" loading="lazy" referrerpolicy="no-referrer" src="https://www.google.com/s2/favicons?domain=' + encodeURIComponent(host) + '&sz=64" onerror="this.remove()"></span>';
  }
  function wishHtml(p){
    var items = Array.isArray(p.items) ? p.items : [], h = '';
    if (items.length){
      h += '<ul class="items">' + items.map(function(it){
        var u = safeUrl(it.u), host = hostOf(u), name = esc(it.t || host || 'Item');
        if (u) return '<li><a class="item" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + favHtml(host) + '<span class="nm">' + name + '</span><span class="host">' + esc(host) + '</span></a></li>';
        return '<li><span class="item"><span class="favwrap">' + GIFT_SVG + '</span><span class="nm">' + name + '</span></span></li>';
      }).join('') + '</ul>';
    }
    if (p.wish) h += '<div class="txt">' + esc(p.wish) + '</div>';
    return h || '<div class="muted">No wish list yet.</div>';
  }
  function itemRow(it){
    it = it || {};
    return '<div class="irow"><input class="it" type="text" maxlength="80" placeholder="What they want, e.g. Cozy socks" aria-label="Item" value="' + esc(it.t || '') + '">' +
      '<input class="iu" type="url" inputmode="url" autocapitalize="off" placeholder="Product link (optional)" aria-label="Product link" value="' + esc(it.u || '') + '">' +
      '<button type="button" class="rm" data-act="rmitem" aria-label="Remove item">&times;</button></div>';
  }
  function editorHtml(id, items, note){
    var rows = (items && items.length ? items : [{}, {}, {}]).map(itemRow).join('');
    return '<div id="' + id + '"><div class="irows">' + rows + '</div>' +
      '<button type="button" class="link" data-act="additem" data-for="' + id + '">+ Add another item</button>' +
      '<label for="' + id + 'Note" style="margin-top:10px">Notes (sizes, colors, ideas)</label>' +
      '<textarea id="' + id + 'Note" maxlength="1500" placeholder="Anything that helps, like favorite colors or sizes.">' + esc(note || '') + '</textarea></div>';
  }
  function readEditor(id){
    var root = $('#' + id), items = [];
    root.querySelectorAll('.irow').forEach(function(r){
      var t = r.querySelector('.it').value.trim(), raw = r.querySelector('.iu').value.trim();
      if (!t && !raw) return;
      items.push({t:t.slice(0, 80), u:safeUrl(raw).slice(0, 500)});
    });
    return {items:items.slice(0, 30), wish:root.querySelector('textarea').value.trim().slice(0, 1500)};
  }

  /* ---------- Illustration ---------- */
  function person(x, s, skin, shirt, hair, o){
    o = o || {}; var pants = o.pants || '#27386e', h = '';
    h += '<g transform="translate(' + x + ' 236) scale(' + s + ')">';
    h += '<rect x="-12" y="-46" width="10" height="46" rx="5" fill="' + pants + '"/><rect x="2" y="-46" width="10" height="46" rx="5" fill="' + pants + '"/>';
    if (o.dress) h += '<path d="M-19 -98 h38 l10 56 h-58z" fill="' + shirt + '"/>';
    else h += '<rect x="-18" y="-100" width="36" height="60" rx="16" fill="' + shirt + '"/>';
    h += '<rect x="-29" y="-94" width="12" height="40" rx="6" fill="' + shirt + '" transform="rotate(12 -23 -94)"/>';
    h += '<rect x="17" y="-94" width="12" height="40" rx="6" fill="' + shirt + '" transform="rotate(-12 23 -94)"/>';
    h += '<circle cx="0" cy="-117" r="16" fill="' + skin + '"/>';
    if (o.bun) h += '<circle cx="0" cy="-139" r="7" fill="' + hair + '"/>';
    h += '<path d="M-17 -119 a17 17 0 0 1 34 0 q-17 -9 -34 0z" fill="' + hair + '"/>';

    if (o.glasses) h += '<g fill="none" stroke="#1b2140" stroke-width="1.6"><circle cx="-6" cy="-116" r="4.6"/><circle cx="6" cy="-116" r="4.6"/><path d="M-1.4 -116 h2.8"/></g>';
    h += '<circle cx="-6" cy="-116" r="1.7" fill="#1b2140"/><circle cx="6" cy="-116" r="1.7" fill="#1b2140"/>';
    h += '<path d="M-5 -109 q5 5 10 0" fill="none" stroke="#1b2140" stroke-width="1.8" stroke-linecap="round"/>';
    h += '<circle cx="-10" cy="-110" r="2.6" fill="#ff8f86" opacity=".55"/><circle cx="10" cy="-110" r="2.6" fill="#ff8f86" opacity=".55"/></g>';
    return h;
  }
  function gift(x, y, w, c1, c2){
    var hh = w * .8;
    return '<g transform="translate(' + x + ' ' + y + ')"><rect x="' + (-w/2) + '" y="' + (-hh) + '" width="' + w + '" height="' + hh + '" rx="3" fill="' + c1 + '"/>' +
      '<rect x="-3" y="' + (-hh) + '" width="6" height="' + hh + '" fill="' + c2 + '"/>' +
      '<circle cx="-5" cy="' + (-hh - 3) + '" r="5" fill="none" stroke="' + c2 + '" stroke-width="3"/><circle cx="5" cy="' + (-hh - 3) + '" r="5" fill="none" stroke="' + c2 + '" stroke-width="3"/></g>';
  }
  function menorah(x){
    var h = '<g transform="translate(' + x + ' 236) scale(1.45)">';
    h += '<path d="M-64 -52 q0 30 64 30 q64 0 64 -30" fill="none" stroke="#f4b73a" stroke-width="5" stroke-linecap="round"/>';
    h += '<rect x="-4" y="-24" width="8" height="18" fill="#f4b73a"/><path d="M-24 0 q0 -9 24 -9 q24 0 24 9z" fill="#f4b73a"/>';
    for (var i = 0; i < 9; i++){
      var cx = -64 + i * 16, top = (i === 4) ? -92 : -76;
      h += '<rect x="' + (cx - 3.5) + '" y="' + top + '" width="7" height="' + (-52 - top) + '" rx="2" fill="#e9f1ff"/>';
      h += '<ellipse class="flame" cx="' + cx + '" cy="' + (top - 7) + '" rx="4" ry="7.5" fill="#ffc83d"/>';
      h += '<ellipse class="flame" cx="' + cx + '" cy="' + (top - 5) + '" rx="2" ry="4" fill="#fff3b8"/>';
    }
    return h + '</g>';
  }
  function scene(){
    var pts = [[40,30,2],[120,70,1.5],[210,24,2],[300,60,1.4],[430,28,2],[520,66,1.6],[610,30,2.2],[690,76,1.5],[70,120,1.4],[660,130,1.6],[560,110,1.2],[160,110,1.2]];

  async function savePerson(id){

    try {
      await F.updateDoc(F.doc(db, 'exchanges', M.id, 'people', id), {name:name, wish:ed.wish, items:ed.items, updatedAt:Date.now()});

    } catch (e) { toast('Could not save. Try again.'); }

  async function addPerson(){
    var inp = $('#mAddName'), name = inp.value.trim().slice(0, 59);
    if (!name){ toast('Type their name first'); return; }
    var pid = rid(12);
    try {
      await F.setDoc(F.doc(db, 'exchanges', M.id, 'people', pid), {name:name, wish:'', items:[], joinedAt:Date.now(), updatedAt:Date.now(), addedByOrganizer:true});
      M.addDraft = ''; toast(name + ' added'); renderM(true);
    } catch (e) { toast('Could not add them. Try again.'); }
  }
  async function removePerson(id){
    var p = M.people.filter(function(q){ return q.id === id; })[0]; if (!p) return;
    M.busy = true; M.msg = ''; renderM(true);
    try {
      var b = F.writeBatch(db), note = '';
      b.update(F.doc(db, 'exchanges', M.id, 'people', id), {removed:true, removedAt:Date.now()});
      var left = M.people.length - 1;
      if (M.ex.drawn && (id in M.picks)){
        var giver = null, target = M.picks[id];
        Object.keys(M.picks).forEach(function(g){ if (g !== id && M.picks[g] === id) giver = g; });
        if (left >= 2 && giver && target && giver !== target){
          b.set(F.doc(db, 'exchanges', M.id, 'picks', giver), {to:target});
          var gp = M.people.filter(function(q){ return q.id === giver; })[0], tp = M.people.filter(function(q){ return q.id === target; })[0];
          note = ' ' + (gp ? gp.name : 'Their giver') + ' now has ' + (tp ? tp.name : 'a new recipient') + ' instead. Let ' + (gp ? gp.name : 'them') + ' know.';
        } else if (left < 2){
          note = ' Only one person is left, so the draw cannot work until someone joins. Add people, then redraw.';
        }
      }
      await b.commit();
      M.confirmRemove = null; M.msg = p.name + ' removed.' + note;
    } catch (e) { M.msg = 'Could not remove ' + p.name + ' (' + (e && e.code ? e.code : 'error') + '). Try again.'; }
    M.busy = false; renderM(true);
  }
  async function saveDetails(){
    var v = $('#mDetails').value.trim().slice(0, 1000);
    try {
      await F.updateDoc(F.doc(db, 'exchanges', M.id), {details:v});
      M.detailsDraft = undefined; toast('Details saved');
    } catch (e) { toast('Could not save the details. Try again.'); }
  }
  async function writePicks(map, onlyKeys){
    var b = F.writeBatch(db);
    Object.keys(map).forEach(function(k){
      if (onlyKeys && onlyKeys.indexOf(k) < 0) return;
      b.set(F.doc(db, 'exchanges', M.id, 'picks', k), {to:map[k]});
    });
    return b;
  }
  async function drawAll(){
    if (M.people.length < 2) return;
    M.busy = true; M.msg = ''; renderM();
    try {
      var ids = shuffle(M.people.map(function(p){ return p.id; })), map = {};
      ids.forEach(function(g, i){ map[g] = ids[(i + 1) % ids.length]; });
      var b = await writePicks(map);
      b.update(F.doc(db, 'exchanges', M.id), {drawn:true, drawnAt:Date.now()});
      await b.commit();
      M.confirm = false; M.msg = 'Names drawn. Everyone can open their link and tap the gift.';
    } catch (e) { M.msg = 'Could not draw the names (' + (e && e.code ? e.code : 'error') + '). Try again.'; }
    M.busy = false; renderM();
  }
  async function addLate(){
    var late = M.people.filter(function(p){ return !(p.id in M.picks); });
    if (!late.length) return;
    M.busy = true; M.msg = ''; renderM();
    try {
      var active = {}; M.people.forEach(function(p){ active[p.id] = true; });
      var picks = {}; Object.keys(M.picks).forEach(function(k){ if (active[k] && active[M.picks[k]]) picks[k] = M.picks[k]; });
      var givers = Object.keys(picks), changed = [], touched = [];
      if (!givers.length){ M.busy = false; return drawAll(); }
      late.forEach(function(u){
        var x = givers[Math.floor(Math.random() * givers.length)];
        var old = picks[x]; picks[x] = u.id; picks[u.id] = old;
        givers.push(u.id);
        if (touched.indexOf(x) < 0) touched.push(x);
        touched.push(u.id);
        if (changed.indexOf(x) < 0 && !late.some(function(l){ return l.id === x; })) changed.push(x);
      });
      var b = await writePicks(picks, touched);
      await b.commit();
      var names = changed.map(function(id){ var p = M.people.filter(function(q){ return q.id === id; })[0]; return p ? p.name : ''; }).filter(Boolean);
      M.msg = 'Added to the draw.' + (names.length ? ' Let ' + names.join(', ') + ' know their recipient changed, in case they already started shopping.' : '');
    } catch (e) { M.msg = 'Could not update the draw (' + (e && e.code ? e.code : 'error') + '). Try again.'; }
    M.busy = false; renderM();
  }

        wishHtml(p) + '</div>';
    });
    $('#eWall').innerHTML = w + '</div>';
  }
  async function join(){
    var err = $('#jErr'); err.hidden = true;
    var name = $('#jName').value.trim(), ed = readEditor('jEd');
    if (!name){ err.textContent = 'Add your name.'; err.hidden = false; return; }
    var pid = rid(12), btn = document.querySelector('[data-act="join"]'); btn.disabled = true;
    try {
      await F.setDoc(F.doc(db, 'exchanges', S.id, 'people', pid), {name:name, wish:ed.wish, items:ed.items, joinedAt:Date.now(), updatedAt:Date.now()});
      var me = lsGet('sg-me', {}); me[S.id] = pid; lsSet('sg-me', me);
      pushRecent('sg-joined', {id:S.id, pid:pid, name:S.ex ? S.ex.name : 'Exchange'});
      location.hash = 'p-' + S.id + '-' + pid;
    } catch (e) { btn.disabled = false; err.textContent = 'Could not join (' + (e && e.code ? e.code : 'error') + '). Try again.'; err.hidden = false; }
  }
  async function saveWish(){
    var st = $('#wishState'); st.textContent = 'Saving...';
    var ed = readEditor('wEd');
    try {
      await F.updateDoc(F.doc(db, 'exchanges', S.id, 'people', S.pid), {wish:ed.wish, items:ed.items, updatedAt:Date.now()});
      st.textContent = 'Saved'; setTimeout(function(){ st.textContent = ''; }, 2000);
    } catch (e) { st.textContent = 'Could not save. Try again.'; }
  }

  /* ---------- Router and events ---------- */
  function route(){
    unsub.forEach(function(f){ try { f(); } catch (e) {} }); unsub = [];
    setStatus('');
    var p = location.hash.slice(1).split('-');
    if (p[0] === 'm' && p[1] && p[2]) viewManage(p[1], p[2]);
    else if (p[0] === 'p' && p[1] && p[2]){
      var me = lsGet('sg-me', {}); if (me[p[1]] !== p[2]){ me[p[1]] = p[2]; lsSet('sg-me', me); }
      viewExchange(p[1], p[2]);
    }
    else if (p[0] === 'e' && p[1]) viewExchange(p[1], null);
    else viewHome();
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'create') create();
    else if (a === 'copyshare') copyText($('#shareLink').value, $('#shareLink'));
    else if (a === 'copymanage') copyText($('#manageLink').value, $('#manageLink'));
    else if (a === 'copyme') copyText($('#meLink').value, $('#meLink'));
    else if (a === 'draw') drawAll();
    else if (a === 'addlate') addLate();
    else if (a === 'redraw1'){ M.confirm = true; renderM(); }
    else if (a === 'redraw0'){ M.confirm = false; renderM(); }
    else if (a === 'redraw2') drawAll();
    else if (a === 'join') join();
    else if (a === 'savewish') saveWish();
    else if (a === 'savedetails') saveDetails();
    else if (a === 'pedit'){ M.editing = b.getAttribute('data-id'); M.confirmRemove = null; renderM(true); }
    else if (a === 'pcancel'){ M.editing = null; renderM(true); }
    else if (a === 'psave') savePerson(b.getAttribute('data-id'));
    else if (a === 'padd') addPerson();
    else if (a === 'premove1'){ M.confirmRemove = b.getAttribute('data-id'); renderM(true); }
    else if (a === 'premove0'){ M.confirmRemove = null; renderM(true); }
    else if (a === 'premove2') removePerson(b.getAttribute('data-id'));
    else if (a === 'plink'){
      var pid2 = b.getAttribute('data-id'), pp = M.people.filter(function(q){ return q.id === pid2; })[0];
      copyText('Shalom ' + (pp ? pp.name : '') + '! Your Secret Gelt link for ' + M.ex.name + ': ' + base() + '#p-' + M.id + '-' + pid2);
    }
    else if (a === 'additem'){
      var host = $('#' + b.getAttribute('data-for') + ' .irows'), d = document.createElement('div');
      d.innerHTML = itemRow(); host.appendChild(d.firstChild);
    }
    else if (a === 'rmitem'){
      var row = b.closest('.irow'), rows = row.parentNode;
      if (rows.children.length > 1) row.remove(); else { row.querySelector('.it').value = ''; row.querySelector('.iu').value = ''; }
    }
    else if (a === 'reveal'){ S.revealed = true; renderS(); }
  });
  window.addEventListener('hashchange', function(){ window.scrollTo(0, 0); route(); });

  $('#scene').innerHTML = scene();
  $('#rot').textContent = LINES[Math.floor(Math.random() * LINES.length)];
  route();
  (async function(){
    try {
      var A = await import(SDK + 'firebase-app.js');
      var Fs = await import(SDK + 'firebase-firestore.js');
      db = Fs.getFirestore(A.initializeApp(CFG)); F = Fs;
    } catch (e) { db = null; F = null; }
    ready = true; route();
  })();
})();
</script>
</body>
</html>
